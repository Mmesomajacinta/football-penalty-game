<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jessy's Football World</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #061b12, #0b3d25);
  color: white;
}

header {
  text-align: center;
  padding: 20px 10px;
  background: #052014;
  border-bottom: 3px solid #20c463;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #b8ffd2;
}

.container {
  width: 94%;
  max-width: 700px;
  margin: auto;
  padding: 15px 0 40px;
}

/* PLAYER INFO */

.player-card {
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.15);
}

.player-card h2 {
  margin: 5px;
}

.points {
  font-size: 25px;
  font-weight: bold;
  color: #ffd700;
}

/* TABS */

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  padding: 12px 5px;
  background: #123b26;
  border: none;
  color: white;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: #18a957;
}

/* GAME */

.game-section {
  display: block;
}

.shop-section {
  display: none;
}

.field {
  position: relative;
  width: 100%;
  height: 340px;
  background:
    repeating-linear-gradient(
      90deg,
      #159447 0px,
      #159447 40px,
      #12853e 40px,
      #12853e 80px
    );
  border: 5px solid white;
  border-radius: 15px;
  overflow: hidden;
}

/* FIELD LINES */

.field::before {
  content: "";
  position: absolute;
  width: 160px;
  height: 160px;
  border: 3px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  left: calc(50% - 80px);
  bottom: -105px;
}

.goal {
  position: absolute;
  width: 82%;
  height: 145px;
  left: 9%;
  top: 20px;
  border: 6px solid white;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 15px,
      rgba(255,255,255,0.18) 16px
    );
}

.keeper {
  position: absolute;
  top: 65px;
  left: calc(50% - 28px);
  font-size: 55px;
  transition: 0.55s ease;
  z-index: 5;
}

.ball {
  position: absolute;
  bottom: 35px;
  left: calc(50% - 22px);
  font-size: 42px;
  transition: 0.65s ease;
  z-index: 6;
}

.player {
  position: absolute;
  bottom: 20px;
  left: 12px;
  font-size: 55px;
}

/* SCORE */

.scoreboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 15px 0;
}

.score-box {
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 5px;
  text-align: center;
}
